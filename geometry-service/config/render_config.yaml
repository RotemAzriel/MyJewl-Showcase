sample_count: 128
resolution: 1024
render_engine: CYCLES
gpu_device: OPTIX          # RTX 4090 on RunPod supports OptiX hardware RT
camera_distance_mm: 120
ring_center: [0.0, 0.0, 4.05]
hdri_min_count: 200
output_formats:
  rgb:    {format: PNG,       color_mode: RGB, color_depth: 8,  compression: 15}
  mask:   {format: PNG,       color_mode: BW,  color_depth: 8}
  depth:  {format: OPEN_EXR, color_mode: BW,  color_depth: 32}
  normal: {format: OPEN_EXR, color_mode: RGB, color_depth: 32}

# Camera schedule (50 views per config)
# 21 systematic: 7 azimuths [0,30,60,90,120,150,180] × 3 elevations [0,30,60]
# 1  top-down:   azimuth=0, elevation=90
# 1  under-ring: azimuth=0, elevation=-30
# 27 random:     azimuth=uniform(0,359), elevation=uniform(-15,75)
focal_length_mm_range: [35, 100]   # log-uniform per view
fstop_range: [2.8, 16.0]           # uniform per view

# Metal PBR — Base Color sRGB and roughness log-uniform [min, max]
metal_types:
  14k_yellow: {base_color: [1.000, 0.766, 0.336], roughness: [0.02, 0.35]}
  18k_yellow: {base_color: [1.000, 0.766, 0.336], roughness: [0.02, 0.35]}
  14k_white:  {base_color: [0.950, 0.950, 0.950], roughness: [0.02, 0.35]}
  18k_white:  {base_color: [0.950, 0.950, 0.950], roughness: [0.02, 0.35]}
  14k_rose:   {base_color: [1.000, 0.650, 0.550], roughness: [0.02, 0.35]}
  18k_rose:   {base_color: [1.000, 0.650, 0.550], roughness: [0.02, 0.35]}
  pt950:      {base_color: [0.960, 0.960, 0.960], roughness: [0.02, 0.25]}
  silver:     {base_color: [0.972, 0.960, 0.915], roughness: [0.03, 0.35]}

# Diamond center stone
diamond: {ior: 2.417, transmission_weight: 1.0, roughness: 0.0, metallic: 0.0}
